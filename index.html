<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYRIL KELVIN Drive | Premium Storage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <!-- Message d'introduction -->
        <section class="intro-card">
            <h2>🔒 Bienvenue sur CYRIL KELVIN Drive</h2>
            <p>Le coffre-fort numérique 3D sécurisé. Créez votre espace privé, uploadez vos fichiers et accédez-y partout. Vos données sont classées automatiquement.</p>
        </section>

        <header>
            <div class="logo">
                <i data-lucide="shield-check" class="gold-icon"></i>
                <h1>CK <span>DRIVE</span></h1>
            </div>
            <div class="header-btns">
                <button onclick="document.getElementById('modal-forgot').style.display='flex'" class="btn-text">Pass oublié ?</button>
                <button id="btn-create-vault" class="btn-primary" onclick="document.getElementById('modal-create').style.display='flex'">
                    <i data-lucide="plus"></i> Nouveau
                </button>
            </div>
        </header>

        <main id="vault-grid">
            <!-- Les coffres apparaîtront ici -->
        </main>
    </div>

    <!-- Modal Création -->
    <div id="modal-create" class="modal">
        <div class="modal-content">
            <h2>Nouveau Coffre</h2>
            <input type="text" id="new-vault-name" placeholder="Nom du coffre">
            <input type="password" id="new-vault-pass" placeholder="Mot de passe">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModals()">Annuler</button>
                <button class="btn-primary" onclick="handleCreateVault()">Créer</button>
            </div>
        </div>
    </div>

    <!-- Modal Mot de passe oublié -->
    <div id="modal-forgot" class="modal">
        <div class="modal-content">
            <h2>Récupération</h2>
            <p>Un agent vous renverra votre mot de passe sur WhatsApp.</p>
            <input type="text" id="recup-nom" placeholder="Votre Nom">
            <input type="text" id="recup-vault" placeholder="Nom du coffre">
            <input type="text" id="recup-phone" placeholder="Votre Numéro WhatsApp">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModals()">Annuler</button>
                <button class="btn-gold" onclick="sendRecoveryWhatsApp()">Envoyer</button>
            </div>
        </div>
    </div>

    <!-- Vue Intérieur du Coffre -->
    <div id="vault-view" class="vault-overlay">
        <div class="vault-header">
            <div class="vault-info">
                <button class="btn-back" onclick="closeVaultView()"><i data-lucide="chevron-left"></i></button>
                <div>
                    <h2 id="welcome-msg">Bienvenue</h2>
                    <p id="current-vault-title" class="gold-text"></p>
                </div>
            </div>
            <div class="vault-btns">
                <input type="file" id="file-upload" multiple onchange="handleFileUpload(event)" hidden>
                <button class="btn-gold" onclick="document.getElementById('file-upload').click()"><i data-lucide="upload-cloud"></i> Upload</button>
                <button class="btn-gold" onclick="downloadAllFiles()"><i data-lucide="download"></i> ZIP All</button>
            </div>
        </div>
        
        <div id="file-sections">
            <!-- Sections générées : Images, Vidéos, Audio, Documents -->
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
    </html>
