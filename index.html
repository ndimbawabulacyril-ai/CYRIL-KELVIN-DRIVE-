<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYRIL KELVIN Drive | Coffres Sécurisés</title>
    <link rel="stylesheet" href="style.css">
    <!-- Polices et Icônes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Bibliothèques 3D et ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <!-- Fond 3D Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <header>
            <div class="logo">
                <i data-lucide="shield-check" class="gold-icon"></i>
                <h1>CYRIL KELVIN <span>DRIVE</span></h1>
            </div>
            <button id="btn-create-vault" class="btn-primary">
                <i data-lucide="plus-circle"></i> Créer un Coffre
            </button>
        </header>

        <main id="vault-grid">
            <!-- Les coffres apparaîtront ici via le JS -->
        </main>
    </div>

    <!-- Modal Création de Coffre -->
    <div id="modal-create" class="modal">
        <div class="modal-content">
            <h2>Nouveau Coffre</h2>
            <input type="text" id="new-vault-name" placeholder="Nom du coffre">
            <input type="password" id="new-vault-pass" placeholder="Mot de passe">
            <div class="modal-actions">
                <!-- Ajout de type="button" pour éviter des rechargements de page inutiles -->
                <button type="button" class="btn-secondary" onclick="closeModals()">Annuler</button>
                <button type="button" class="btn-primary" onclick="handleCreateVault()">Créer</button>
            </div>
        </div>
    </div>

    <!-- Vue Intérieur du Coffre -->
    <div id="vault-view" class="vault-overlay">
        <div class="vault-header">
            <button class="btn-back" onclick="closeVaultView()">
                <i data-lucide="arrow-left"></i> Retour
            </button>
            <h2 id="current-vault-title">Nom du Coffre</h2>
            <div class="vault-actions">
                <!-- Input file caché -->
                <input type="file" id="file-upload" multiple accept="image/*,video/*" hidden onchange="handleFileUpload(event)">
                
                <button class="btn-gold" onclick="document.getElementById('file-upload').click()">
                    <i data-lucide="upload"></i> Upload
                </button>
                <button class="btn-gold" onclick="downloadAllFiles()">
                    <i data-lucide="download-cloud"></i> ZIP All
                </button>
            </div>
        </div>
        <div id="file-grid" class="file-grid">
            <!-- Photos et Vidéos apparaîtront ici -->
        </div>
    </div>

    <!-- LE CHANGEMENT CRUCIAL EST ICI : type="module" -->
    <script type="module" src="script.js"></script>
</body>
</html>
